<form method="POST" action="{% url 'create_transaction' %}" novalidate>
    {% csrf_token %}

    <div class="dialog-header">
        <h1 class="dialog-title" id="transactionDialogTitle">New Transaction</h1>
         <button type="button" class="btn-close" data-bs-dismiss="dialog" aria-label="Close"></button>
    </div>

    <div class="dialog-body">
        {% if transaction_create_form.non_field_errors %}
            <div class="alert alert-danger">{{ transaction_create_form.non_field_errors }}</div>
        {% endif %}

        {% for field in transaction_create_form %}
            <div class="mb-3">
                <label for="{{ field.id_for_label }}" class="form-label">
                    {{ field.label }}
                </label>

                {{ field }}

                {% for error in field.errors %}
                    <p class="fg-danger small">{{ error }}</p>
                {% endfor %}
            </div>
        {% endfor %}
    </div>

   <div class="dialog-footer">
        <button type="button" class="btn-solid theme-secondary" data-bs-dismiss="dialog">Cancel</button>
        <button type="submit" class="btn-solid theme-primary">Save</button>
   </div>
</form>
